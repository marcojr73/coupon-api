openapi: 3.0.3
info:
  title: Coupon API
  description: API para gerenciamento de cupons.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor Local
paths:
  /auth/sign-up:
    post:
      tags:
        - Autenticação
      summary: Cria um novo usuário
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignUpRequestDto'
      responses:
        '210':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponseDto'
  /auth/sign-in:
    post:
      tags:
        - Autenticação
      summary: Realiza autenticação do usuário
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignInRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponseDto'
  /coupon:
    post:
      tags:
        - Cupons
      summary: Cria um novo cupom
      operationId: createCoupon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponRequestDto'
      responses:
        '210':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponseDto'
    get:
      tags:
        - Cupons
      summary: Lista todos os cupons
      operationId: listCoupons
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de cupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponUseCaseOutput'
  /coupon/{id}:
    get:
      tags:
        - Cupons
      summary: Lista cupom por id
      operationId: showCoupon
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cupom encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponUseCaseOutput'
    put:
      tags:
        - Cupons
      summary: Atualiza um cupom por id
      operationId: updateCoupon
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponUpdateRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponseDto'
    delete:
      tags:
        - Cupons
      summary: Exclui um cupom
      operationId: deleteCoupon
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '210':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponseDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserSignUpRequestDto:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    UserSignInRequestDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    SignInResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        message:
          type: string
    DefaultResponseDto:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
    CouponRequestDto:
      type: object
      required:
        - code
        - description
        - discountValue
        - expirationDate
      properties:
        code:
          type: string
        description:
          type: string
        discountValue:
          type: number
          format: decimal
          minimum: 0.5
        expirationDate:
          type: string
          format: date
        published:
          type: boolean
    CouponUpdateRequestDto:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        discountValue:
          type: number
          format: decimal
          minimum: 0.5
        expirationDate:
          type: string
          format: date
        published:
          type: boolean
    CouponUseCaseOutput:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string
        discountValue:
          type: number
          format: decimal
        expirationDate:
          type: string
          format: date
        published:
          type: boolean
        createdDate:
          type: string
          format: date
